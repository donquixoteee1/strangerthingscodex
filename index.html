<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#121212"><title>The living room</title></head><body>

<main id="stage"><header><span class="muted">New chat</span><span class="preview-badge"><i></i> Local preview</span></header>

<div class="preview-toolbar" aria-label="Visual preview"><label id="detail-label" for="pixel-size">Size</label><input id="pixel-size" type="range" min="2" max="12" value="4" step="1"><output id="pixel-value" for="pixel-size">4 px</output></div>
<section class="welcome"><h1><span class="sr-only">What would you like to build?</span><img class="ascii-title" src="%BASE_URL%scene/title.svg" alt="" aria-hidden="true"></h1><p>Some things are better said in lights.</p></section>

<section class="composer-zone"><div class="context-bar"><span>▰ &nbsp; This computer</span><span class="context-settings">⚙</span></div><form id="composer" class="composer"><label class="sr-only" for="message">Message</label><textarea id="message" placeholder="Ask anything, or send a signal with the lights…" rows="2" spellcheck="false"></textarea><div class="composer-tools"><div><button type="button" id="attach" aria-label="About attachments">＋</button><span class="access-label">♧ Full access</span></div><span class="model-label">GPT-6.1 Sol · Medium ⌄</span><button type="submit" class="send" aria-label="Send preview message">↑</button></div></form><div class="controls"><label><input id="english" type="checkbox" title="Enable letter input. Paused during IME composition."><span class="switch"></span>English Lights Mode</label><span class="control-divider"></span><label><input id="motion" type="checkbox" checked>Motion</label><label><input id="skin" type="checkbox" checked>Skin</label></div><p id="feedback" role="status" aria-live="polite"></p></section>
</main><script type="module" src="/src/main.ts"></script></body></html>
